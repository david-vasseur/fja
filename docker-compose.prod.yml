services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: dvweb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - nginx-network
      - fja-network

networks:
  nginx-network:
    external: true
  fja-network:
    external: true
      